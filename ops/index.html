<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stratos Ops</title>
<meta name="description" content="Stratos Aviation Detailing — operations console: jobs, inspections, photo documentation, QA, inventory.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1A0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stratos Ops">
<link rel="manifest" href="/ops/manifest.json">
<link rel="icon" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ops/styles.css">
</head>
<body>

<div id="splash" class="splash">
  <img src="/images/logo-emblem.png" alt="">
  <div class="splash-word">STRATOS OPS</div>
  <div id="splash-slow" class="hidden" style="text-align:center;margin-top:10px">
    <div style="color:#C8C4BC;font-size:13px;margin-bottom:10px">Taking longer than it should.</div>
    <button onclick="location.reload()" style="background:none;border:1px solid #9B7E2F;color:#D4B86A;border-radius:10px;padding:10px 18px;font:600 14px 'DM Sans',sans-serif;cursor:pointer">Reload</button>
  </div>
</div>
<script>setTimeout(function(){var s=document.getElementById('splash'),h=document.getElementById('splash-slow');if(s&&h&&!s.classList.contains('hidden'))h.classList.remove('hidden');},12000);</script>

<div id="auth" class="hidden"></div>
<div id="public" class="hidden"></div>

<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar" id="topbar"></header>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
<input type="file" id="gallery-input" accept="image/*" multiple hidden>

<script type="module" src="/ops/js/main.js"></script>
<noscript>Stratos Ops needs JavaScript turned on.</noscript>
</body>
</html>
